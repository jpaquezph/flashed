<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0812" />
    <title>FLASHED — The Party Photographer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0812;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        /* Deja libres la muesca y los bordes redondeados del teléfono. */
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      /* En teléfonos el juego se juega en horizontal: en vertical se pide girarlo. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0812;
        color: #ffffff;
        font-family: 'Arial Black', 'Segoe UI Black', Impact, sans-serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      #rotate svg {
        width: 96px;
        height: 96px;
        animation: turn 2.2s ease-in-out infinite;
      }
      #rotate b {
        font-size: 22px;
        font-style: italic;
      }
      #rotate span {
        font-size: 14px;
        color: #ff8a2f;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <svg viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
        <rect x="14" y="4" width="20" height="40" rx="4" />
        <path d="M21 38h6" stroke-linecap="round" />
      </svg>
      <b>GIRÁ EL TELÉFONO</b>
      <span>Rotate your phone</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
